<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarPlay Screen Inventory</title>
<style>
:root{--blue:#073d82;--ink:#18202b;--line:#e3e7ec;--bg:#f6f8fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.top{background:var(--blue);color:#fff;min-height:76px;padding:11px max(24px,5vw);display:flex;align-items:center;gap:28px}
.logo{font-size:34px;font-weight:900;letter-spacing:-2px;white-space:nowrap}
.vehicle{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:10px;overflow:hidden;max-width:610px;flex:1}
.vehicle select{appearance:none;border:0;border-right:1px solid var(--line);padding:17px 20px;background:#fff;font-weight:700;color:#222;outline:none;min-width:0}
.vehicle select:last-child{border:0}.phone{margin-left:auto;color:#fff;text-decoration:none;font-size:17px;font-weight:800;white-space:nowrap}
.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 max(24px,5vw);height:48px;display:flex;align-items:center;gap:30px;color:var(--blue);font-weight:800}
.nav span{height:48px;display:flex;align-items:center;border-bottom:3px solid var(--blue)}
.wrap{max-width:1250px;margin:0 auto;padding:30px 24px 60px}.intro h1{margin:0;font-size:30px}.intro p{color:#667085;margin:8px 0 26px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-title{padding:20px 22px;font-size:20px;font-weight:800;border-bottom:1px solid var(--line)}
.brands{display:grid;grid-template-columns:repeat(4,1fr)}.brand{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:19px 22px;text-align:left;font-size:16px;font-weight:700;color:#555;cursor:pointer}
.brand:hover,.brand.active{background:#f0f6ff;color:var(--blue)}.results{margin-top:24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:12px}.card b{font-size:18px}.muted{color:#667085;margin-top:6px}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:#667085}
@media(max-width:800px){.top{flex-wrap:wrap;gap:12px;padding:13px 16px}.logo{font-size:28px}.phone{font-size:14px}.vehicle{order:3;min-width:100%}.vehicle select{padding:14px 8px;font-size:13px}.nav{padding:0 16px}.wrap{padding:22px 14px}.brands{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
 <div class="logo">CARPLAY</div>
 <div class="vehicle">
  <select id="year"><option value="">Year</option></select>
  <select id="make"><option value="">Make</option></select>
  <select id="model"><option value="">Model</option></select>
 </div>
 <a class="phone" href="tel:+13657374556">☎&nbsp; 365-737-4556</a>
</header>
<div class="nav"><span>Brands</span><div>Services</div></div>
<main class="wrap">
 <section class="intro"><h1>CarPlay Screen Inventory</h1><p>Select your vehicle or browse by brand to see available screens.</p></section>
 <section class="panel"><div class="panel-title">Shop by Brand</div><div class="brands" id="brands"></div></section>
 <section class="results" id="results"></section>
</main>
<script>
const stock=[
["Honda","CR-V",2002,2006],["Toyota","Corolla",2009,2013],["Nissan","Frontier",2005,2008],
["Nissan","Altima",2013,2018],["Ford","Mustang",2005,2009],["Ford","Edge",2007,2010],
["Chevrolet","Silverado",2007,2014],["Dodge","Nitro",2007,2011],["Dodge","Grand Caravan",2008,2020],
["Volkswagen","Rabbit Mk5",2006,2009]
];
const allBrands=["Acura","Audi","BMW","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Honda","Hyundai","Jeep","Kia","Lexus","Mazda","Mercedes-Benz","Mitsubishi","Nissan","Subaru","Toyota","Volkswagen"];
const Y=document.querySelector("#year"),M=document.querySelector("#make"),D=document.querySelector("#model"),B=document.querySelector("#brands"),R=document.querySelector("#results");
function opt(el,v){el.add(new Option(v,v))}
for(let y=new Date().getFullYear()+1;y>=1995;y--)opt(Y,y);
[...new Set(stock.map(x=>x[0]))].sort().forEach(x=>opt(M,x));
allBrands.forEach(b=>{const x=document.createElement("button");x.className="brand";x.textContent=b;x.onclick=()=>{M.value=[...M.options].some(o=>o.value===b)?b:"";Y.value="";loadModels();showBrand(b,x)};B.appendChild(x)});
function loadModels(){D.innerHTML='<option value="">Model</option>';[...new Set(stock.filter(x=>!M.value||x[0]===M.value).map(x=>x[1]))].sort().forEach(x=>opt(D,x));render()}
function showBrand(b,el){document.querySelectorAll(".brand").forEach(x=>x.classList.remove("active"));el.classList.add("active");const a=stock.filter(x=>x[0]===b);R.innerHTML=a.length?a.map(card).join(""):'<div class="notice">No screen currently listed for '+b+'.</div>'}
function card(x){return '<div class="card"><b>'+x[0]+' '+x[1]+'</b><div class="muted">'+x[2]+'–'+x[3]+'</div></div>'}
function render(){document.querySelectorAll(".brand").forEach(x=>x.classList.remove("active"));let a=stock.filter(x=>(!M.value||x[0]===M.value)&&(!D.value||x[1]===D.value)&&(!Y.value||(+Y.value>=x[2]&&+Y.value<=x[3])));R.innerHTML=(M.value||D.value||Y.value)?(a.length?a.map(card).join(""):'<div class="notice">No matching screen is currently listed.</div>'):""}
M.onchange=loadModels;D.onchange=render;Y.onchange=render;
</script>
</body></html>
