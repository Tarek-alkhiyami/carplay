<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarPlay Screen Inventory</title>
<style>
:root{--blue:#073d82;--ink:#18202b;--line:#e3e7ec;--bg:#f6f8fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.top{background:var(--blue);color:#fff;min-height:76px;padding:11px max(24px,5vw);display:flex;align-items:center;gap:28px}
.logo{font-size:34px;font-weight:900;letter-spacing:-2px;white-space:nowrap}
.vehicle{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:10px;overflow:hidden;max-width:610px;flex:1}
.vehicle select{appearance:none;border:0;border-right:1px solid var(--line);padding:17px 20px;background:#fff;font-weight:700;color:#222;outline:none;min-width:0}
.vehicle select:last-child{border:0}.phone{margin-left:auto;color:#fff;text-decoration:none;font-size:17px;font-weight:800;white-space:nowrap}.cart{color:#fff;text-decoration:none;font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:9px}.cart:hover{background:rgba(255,255,255,.12)}
.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 max(24px,5vw);height:48px;display:flex;align-items:center;gap:30px;color:var(--blue);font-weight:800}
.nav span{height:48px;display:flex;align-items:center;border-bottom:3px solid var(--blue)}
.wrap{max-width:1250px;margin:0 auto;padding:30px 24px 60px}.intro h1{margin:0;font-size:30px}.install-fee{display:inline-block;margin-top:8px;font-size:20px;font-weight:900;color:#073d82}.intro p{color:#667085;margin:7px 0 26px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-title{padding:20px 22px;font-size:20px;font-weight:800;border-bottom:1px solid var(--line)}
.brands{display:grid;grid-template-columns:repeat(4,1fr)}.brand{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:19px 22px;text-align:left;font-size:16px;font-weight:700;color:#555;cursor:pointer}
.brand:hover,.brand.active{background:#f0f6ff;color:var(--blue)}.results{margin-top:24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:12px}.card b{font-size:18px}.muted{color:#667085;margin-top:6px}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:#667085}
@media(max-width:800px){.top{flex-wrap:wrap;gap:12px;padding:13px 16px}.logo{font-size:28px}.phone{font-size:14px}.vehicle{order:3;min-width:100%}.vehicle select{padding:14px 8px;font-size:13px}.nav{padding:0 16px}.wrap{padding:22px 14px}.brands{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
 <div class="logo">CARPLAY</div>
 <div class="vehicle">
  <select id="make"><option value="">Make</option></select>
  <select id="year"><option value="">Year</option></select>
  <select id="model"><option value="">Model</option></select>
 </div>
 <a class="phone" href="tel:+13657374556">☎&nbsp; 365-737-4556</a>\n <a class="cart" href="#cart" aria-label="Shopping cart" title="Shopping cart">🛒</a>
</header>
<div class="nav"><span>Brands</span><div>Services</div></div>
<main class="wrap">
 <section class="intro"><h1>CarPlay Screen Inventory</h1><div class="install-fee">Installation Fee $200</div><p>Select your vehicle or browse by brand to see available screens.</p></section>
 <section class="panel"><div class="panel-title">Shop by Brand</div><div class="brands" id="brands"></div></section>
 <section class="results" id="results"></section>
</main>
<script>
const stock=[
["Mercedes-Benz","SL-Class (R230 / SL350 / SL500 / SL63 / SL65)",2005,2012,'9"',"4GB/64GB",149.99],
["Dodge","Nitro",2007,2011,'7"',"2GB/64GB",149.99],
["BMW","3 Series E46",1999,2004,'7"',"2GB/64GB",199.99],
["Honda","CR-V",2002,2006,'9"',"4GB/64GB",99.99],
["Nissan","Altima",2013,2018,'9"',"2GB/32GB",149.99],
["Mercedes-Benz","C-Class W204 / S204",2006,2011,'9"',"1GB/32GB or 2GB/64GB",199.99],
["Ford","Edge",2007,2010,'7"',"4GB/64GB",199.99],
["Toyota","Tacoma",2005,2013,'10"',"2GB/32GB",249.99],
["Ford","Escape",2013,2019,'9"',"",249.99],
["Mercedes-Benz","C-Class W203",2003,2009,'9"',"2GB/64GB",249.99],
["Mercedes-Benz","CLK W209",2003,2009,'9"',"2GB/64GB",249.99],
["Fiat","500",2007,2015,'6.86"',"2GB/64GB",199.99],
["Dodge","Grand Caravan",2008,2020,'7"',"2GB/32GB",199.99],
["Volkswagen","Rabbit Mk5",2006,2009,'9"',"2GB/32GB",149.99],
["Chevrolet","Silverado 1500HD / 2500HD / 3500HD",2007,2014,'10"',"2GB/32GB",199.99],
["Ford","F-250 / F-350 Super Duty",1999,2004,'7"',"4GB/64GB",199.99],
["Ford","Fusion",2005,2011,'7"',"4GB/64GB",199.99],
["Ford","Fiesta",2005,2017,'7"',"4GB/64GB",199.99],
["Ford","Transit",2005,2016,'7"',"4GB/64GB",199.99],
["Ford","Focus",2005,2008,'7"',"4GB/64GB",199.99],
["Toyota","Corolla",2009,2013,'7"',"2GB/64GB",149.99],
["Nissan","Frontier",2005,2008,'7"',"2GB/32GB",149.99],
["Nissan","Frontier (8-Core)",2005,2008,'7"',"2GB/32GB",179.99],
["Ford","Mustang",2005,2009,'7"',"2GB/64GB",149.99],
["Toyota","Corolla",2009,2013,'9"',"4GB/64GB",174.99],
["Toyota","Corolla",2013,2017,'10.1"',"4GB/64GB",249.99],
["Ford","F-150",2009,2012,'9"',"2GB/64GB",199.99],
["Nissan","Altima / Teana",2013,2018,'10"',"2GB/64GB",149.99],
["Toyota","RAV4",2013,2019,'10.1"',"4GB/64GB",174.99],
["Nissan","Versa Sedan",2015,2019,'10.1"',"2GB/32GB",149.99],
["Chevrolet","Silverado / Impala / Tahoe",2003,2006,'7"',"4GB/64GB",124.99],
["GMC","Sierra / Yukon",2003,2006,'7"',"4GB/64GB",124.99]
];
const allBrands=["BMW","Chevrolet","Dodge","Fiat","Ford","GMC","Honda","Mercedes-Benz","Nissan","Toyota","Volkswagen"];
const Y=document.querySelector("#year"),M=document.querySelector("#make"),D=document.querySelector("#model"),B=document.querySelector("#brands"),R=document.querySelector("#results");
function opt(el,v){el.add(new Option(v,v))}
for(let y=new Date().getFullYear()+1;y>=1995;y--)opt(Y,y);
[...new Set(stock.map(x=>x[0]))].sort().forEach(x=>opt(M,x));
allBrands.forEach(b=>{const x=document.createElement("button");x.className="brand";x.textContent=b;x.onclick=()=>{M.value=[...M.options].some(o=>o.value===b)?b:"";Y.value="";loadModels();showBrand(b,x)};B.appendChild(x)});
function loadModels(){D.innerHTML='<option value="">Model</option>';[...new Set(stock.filter(x=>!M.value||x[0]===M.value).map(x=>x[1]))].sort().forEach(x=>opt(D,x));render()}
function showBrand(b,el){document.querySelectorAll(".brand").forEach(x=>x.classList.remove("active"));el.classList.add("active");const a=stock.filter(x=>x[0]===b);R.innerHTML=a.length?a.map(card).join(""):'<div class="notice">No screen currently listed for '+b+'.</div>'}
function card(x){
 return '<div class="card"><b>'+x[0]+' '+x[1]+'</b><div class="muted">'+x[2]+'–'+x[3]+' &nbsp; • &nbsp; '+x[4]+(x[5]?' &nbsp; • &nbsp; '+x[5]:'')+'</div><div style="font-size:22px;font-weight:900;color:#073d82;margin-top:10px">$'+x[6].toFixed(2)+' CAD</div></div>';
}
function render(){
 document.querySelectorAll(".brand").forEach(x=>x.classList.remove("active"));
 let a=stock.filter(x=>(!M.value||x[0]===M.value)&&(!D.value||x[1]===D.value)&&(!Y.value||(+Y.value>=x[2]&&+Y.value<=x[3])));
 R.innerHTML=(M.value||D.value||Y.value)?(a.length?a.map(card).join(""):'<div class="notice">No matching screen is currently listed.</div>'):"";
}
M.onchange=loadModels;D.onchange=render;Y.onchange=render;
</script>
</body>
</html>
